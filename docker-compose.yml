services:
  web:
    build: .
    image: todoagent:latest
    container_name: todoagent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/todoagent.db
