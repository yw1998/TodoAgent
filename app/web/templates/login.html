<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - TodoAgent</title>
<style>
 body{font:13px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
   margin:0;background:#f7f8fa;color:#1f2328;display:flex;min-height:100vh;align-items:center;justify-content:center}
 .box{background:#fff;border:1px solid #d8dee4;border-radius:6px;padding:28px;width:320px}
 h3{margin:0 0 2px;font-size:15px}
 .sub{color:#59636e;margin-bottom:18px}
 input{width:100%;padding:6px 10px;margin:6px 0;border:1px solid #d8dee4;border-radius:6px;font-size:13px;outline:none;box-sizing:border-box}
 input:focus{border-color:#0969da;box-shadow:0 0 0 2px #0969da33}
 button{width:100%;padding:7px;background:#1f883d;color:#fff;border:1px solid #1f883d;
   border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;margin-top:10px}
 button:hover{background:#1a7f37}
 .err{color:#cf222e;font-size:12px;background:#ffebe9;border:1px solid #ff818266;padding:6px 10px;border-radius:6px;margin-bottom:4px}
</style></head>
<body>
<form class="box" method="post" action="/admin/login">
  <h3>TodoAgent 管理后台</h3>
  <div class="sub">请使用管理员账号登录</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="用户名" required>
  <input name="password" type="password" placeholder="密码" required>
  <button type="submit">登录</button>
</form>
</body>
</html>
