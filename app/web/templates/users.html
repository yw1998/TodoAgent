{% extends "base.html" %}
{% block content %}
<h1 class="page">用户</h1>
<div class="panel">
<table>
  <thead><tr><th>ID</th><th>渠道</th><th>外部 ID</th><th>名称</th><th>会话</th><th>待提醒</th></tr></thead>
  <tbody>
  {% for u, c in rows %}
  <tr><td class="muted">{{ u.id }}</td><td>{{ u.channel }}</td>
      <td><small>{{ u.external_id }}</small></td>
      <td>{{ u.name }}</td><td><small>{{ u.chat_id }}</small></td>
      <td>{{ c }}</td></tr>
  {% else %}<tr><td colspan="6" class="empty">暂无用户</td></tr>{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
