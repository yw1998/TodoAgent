<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoAgent 管理</title>
  <style>
    :root {
      --bg: #f7f8fa; --surface: #fff; --text: #1f2328; --muted: #59636e;
      --line: #d8dee4; --line-soft: #e8ebee;
      --blue: #0969da; --nav-h: 52px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header { background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10; }
    .bar { height: var(--nav-h); max-width: 1180px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; gap: 24px; }
    .brand { font-size: 14px; font-weight: 650; color: var(--text); letter-spacing: .2px; }
    .brand:hover { text-decoration: none; }
    .bar nav { display: flex; gap: 4px; flex: 1; }
    .bar nav a { color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; }
    .bar nav a:hover { color: var(--text); background: #eef1f4; text-decoration: none; }
    .bar nav a.cur { color: var(--text); background: #eaeef2; }
    .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
    .meta a { color: var(--muted); margin-left: 12px; }
    .meta a:hover { color: var(--text); }

    main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 40px; }
    h1.page { font-size: 16px; font-weight: 650; margin: 0 0 14px; }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
      margin-bottom: 16px; overflow: hidden; }
    .panel .body { padding: 16px 18px; }
    .panel h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }

    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
      background: #fbfcfd; padding: 8px 14px; border-bottom: 1px solid var(--line); }
    td { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .kv td:first-child { width: 300px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px; color: var(--muted); }

    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
      border: 1px solid; line-height: 18px; }
    .pending { color: #7d4e00; background: #fff8c5; border-color: #d4a72c66; }
    .overdue { color: #cf222e; background: #ffebe9; border-color: #ff818266; }
    .done { color: #1a7f37; background: #dafbe1; border-color: #4ac26b66; }
    .cancelled { color: var(--muted); background: #eef1f4; border-color: var(--line); }
    .error { color: #cf222e; background: #ffebe9; border-color: #ff818266; }
    .ok { color: #1a7f37; background: #dafbe1; border-color: #4ac26b66; }

    .btn { display: inline-block; border: 1px solid var(--line); cursor: pointer; font-size: 12px;
      font-weight: 500; background: var(--surface); color: var(--text);
      padding: 5px 12px; border-radius: 6px; }
    .btn:hover { background: #eef1f4; border-color: #c6cbd1; text-decoration: none; }
    .btn-primary { background: #1f883d; border-color: #1f883d; color: #fff; }
    .btn-primary:hover { background: #1a7f37; border-color: #176e31; }
    .btn-danger { color: #cf222e; }
    .btn-danger:hover { background: #ffebe9; border-color: #ff8182; }
    .btn-sm { padding: 3px 9px; }

    input, select { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
      font-size: 13px; background: var(--surface); color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px #0969da33; }

    form.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .pager { display: flex; gap: 14px; align-items: center; margin-top: 12px; color: var(--muted); }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    small { color: var(--muted); }
    .muted { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 28px; }
    .note { color: #1a7f37; }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/admin/todos">TodoAgent</a>
    <nav>
      <a href="/admin/todos" class="{{ 'cur' if request.url.path in ('/admin/','/admin/todos') else '' }}">待办事项</a>
      <a href="/admin/users" class="{{ 'cur' if request.url.path=='/admin/users' else '' }}">用户</a>
      <a href="/admin/settings" class="{{ 'cur' if request.url.path=='/admin/settings' else '' }}">配置</a>
      <a href="/admin/logs" class="{{ 'cur' if request.url.path=='/admin/logs' else '' }}">日志</a>
    </nav>
    <span class="meta">时区 {{ tz_label() }}<a href="/admin/logout">退出</a></span>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
