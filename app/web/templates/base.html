<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoAgent 管理</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    nav { background: #1f2937; color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: center; }
    nav a { color: #d1d5db; text-decoration: none; }
    nav a:hover, nav .cur { color: #fff; font-weight: 600; }
    nav .spacer { flex: 1; }
    main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #f9fafb; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .pending { background: #fef3c7; color: #92400e; }
    .done { background: #d1fae5; color: #065f46; }
    .cancelled { background: #e5e7eb; color: #4b5563; }
    .error { background: #fee2e2; color: #991b1b; }
    form.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, button { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    button { background: #2563eb; color: #fff; cursor: pointer; border-color: #2563eb; }
    .card { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 16px; }
    .kv td:first-child { width: 280px; font-family: monospace; }
  </style>
</head>
<body>
<nav>
  <a href="/admin/todos" class="{{ 'cur' if request.url.path in ('/admin/','/admin/todos') else '' }}">待办</a>
  <a href="/admin/users" class="{{ 'cur' if request.url.path=='/admin/users' else '' }}">用户</a>
  <a href="/admin/settings" class="{{ 'cur' if request.url.path=='/admin/settings' else '' }}">配置</a>
  <a href="/admin/logs" class="{{ 'cur' if request.url.path=='/admin/logs' else '' }}">日志</a>
  <span class="spacer"></span>
  <span style="color:#9ca3af;font-size:13px">时区 {{ tz_label() }}</span>
  <a href="/admin/logout">退出</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
