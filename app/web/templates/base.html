<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoAgent 管理</title>
  <style>
    :root {
      --bg: #f6f7fb; --surface: #ffffff; --text: #111827; --text-2: #6b7280;
      --line: #e5e7eb; --accent: #4f46e5; --accent-2: #eef2ff;
      --green: #059669; --green-bg: #d1fae5; --amber: #b45309; --amber-bg: #fef3c7;
      --gray: #4b5563; --gray-bg: #f3f4f6; --red: #dc2626; --red-bg: #fee2e2;
      --radius: 12px; --shadow: 0 1px 3px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }

    .layout { display: flex; min-height: 100vh; }
    aside { width: 220px; flex-shrink: 0; background: #0f172a; color: #cbd5e1;
      display: flex; flex-direction: column; padding: 20px 12px; position: sticky; top: 0; height: 100vh; }
    aside .logo { color: #fff; font-size: 17px; font-weight: 700; padding: 6px 12px 20px; letter-spacing: .3px; }
    aside .logo span { color: #818cf8; }
    aside nav { display: flex; flex-direction: column; gap: 4px; }
    aside nav a { color: #94a3b8; padding: 10px 12px; border-radius: 8px; font-weight: 500; transition: .15s; }
    aside nav a:hover { background: #1e293b; color: #e2e8f0; }
    aside nav a.cur { background: var(--accent); color: #fff; }
    aside .foot { margin-top: auto; padding: 12px; font-size: 12px; color: #64748b;
      display: flex; justify-content: space-between; align-items: center; }
    aside .foot a { color: #94a3b8; }
    aside .foot a:hover { color: #fff; }

    main { flex: 1; padding: 28px 32px; max-width: 1200px; }
    h1.page { font-size: 20px; margin: 0 0 18px; font-weight: 700; }

    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
      border: 1px solid var(--line); overflow: hidden; margin-bottom: 18px; }
    .card .body { padding: 18px 20px; }
    .card h3 { margin: 0 0 14px; font-size: 15px; }

    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px;
      color: var(--text-2); background: #fafafa; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }
    .kv td:first-child { width: 300px; font-family: ui-monospace, monospace; color: var(--text-2); }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pending { background: var(--amber-bg); color: var(--amber); }
    .done { background: var(--green-bg); color: var(--green); }
    .cancelled { background: var(--gray-bg); color: var(--gray); }
    .error { background: var(--red-bg); color: var(--red); }
    .ok { background: var(--green-bg); color: var(--green); }

    .btn { display: inline-block; border: 0; cursor: pointer; font-size: 13px; font-weight: 600;
      background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; transition: .15s; }
    .btn:hover { background: #4338ca; }
    .btn-ghost { background: var(--gray-bg); color: var(--gray); }
    .btn-ghost:hover { background: #e5e7eb; }
    .btn-danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red-bg); }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

    input, select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
      font-size: 14px; background: #fff; color: var(--text); outline: none; transition: .15s; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }

    form.filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .pager { display: flex; gap: 14px; align-items: center; margin-top: 14px; color: var(--text-2); }
    .pill { background: var(--accent-2); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
    code { background: var(--gray-bg); padding: 2px 6px; border-radius: 6px; font-size: 12px;
      font-family: ui-monospace, monospace; }
    small { color: var(--text-2); }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="logo">Todo<span>Agent</span></div>
    <nav>
      <a href="/admin/todos" class="{{ 'cur' if request.url.path in ('/admin/','/admin/todos') else '' }}">📋 待办事项</a>
      <a href="/admin/users" class="{{ 'cur' if request.url.path=='/admin/users' else '' }}">👤 用户</a>
      <a href="/admin/settings" class="{{ 'cur' if request.url.path=='/admin/settings' else '' }}">⚙️ 配置</a>
      <a href="/admin/logs" class="{{ 'cur' if request.url.path=='/admin/logs' else '' }}">📜 日志</a>
    </nav>
    <div class="foot">
      <span>时区 {{ tz_label() }}</span>
      <a href="/admin/logout">退出</a>
    </div>
  </aside>
  <main>{% block content %}{% endblock %}</main>
</div>
</body>
</html>
